[project]
name = "solarguard-dz"
version = "1.0.0"
description = "Full-Stack Streamlit Energy Analytics, Solar PV Diagnostics & Microgrid Optimization Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.42.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "openpyxl>=3.1.0",
    "pydeck>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
